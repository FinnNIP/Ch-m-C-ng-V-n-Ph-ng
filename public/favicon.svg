<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Checkmark & Dial Gradient -->
    <linearGradient id="glowCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Outer Pulse Ring -->
  <circle cx="32" cy="34" r="18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Clock / Attendance Dial -->
  <circle cx="32" cy="34" r="15" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.9" />

  <!-- Clock Ticks -->
  <circle cx="32" cy="22" r="1" fill="#38bdf8" />
  <circle cx="44" cy="34" r="1" fill="#818cf8" />
  <circle cx="32" cy="46" r="1" fill="#34d399" />
  <circle cx="20" cy="34" r="1" fill="#38bdf8" />

  <!-- Bold Glowing Checkmark (Chấm Công Hoàn Tất) -->
  <path d="M24 34 L29.5 39.5 L40.5 27.5" fill="none" stroke="url(#glowCheck)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Cosmic Sparkle / Star in top-right (Van Gogh Star theme) -->
  <path d="M47 8 Q47 15 40 15 Q47 15 47 22 Q47 15 54 15 Q47 15 47 8 Z" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="47" cy="15" r="1.5" fill="#ffffff" />
</svg>
