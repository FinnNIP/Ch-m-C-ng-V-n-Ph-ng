  <script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  fetch('/api/client-error', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg, url, lineNo, columnNo, stack: error ? error.stack : '' })
  }).catch(() => {});
};
