    <meta property="og:title" content="Chấm Công Văn Phòng" />

  <script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  fetch('/api/client-error', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg, url, lineNo, columnNo, stack: error ? error.stack : '' })
  }).catch(() => {});
};
</script></head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 52px; height: 52px; border-radius: 18px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          <svg style="width: 26px; height: 26px; color: white;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div style="font-weight: 700; font-size: 18px; color: #f8fafc; letter-spacing: -0.02em; margin-bottom: 8px;">Chấm Công Văn Phòng</div>
        <div style="font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 8px;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6366f1; animation: pulse 1.5s infinite;"></span>
          Đang khởi động hệ thống...
        </div>
        <style>
          @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
